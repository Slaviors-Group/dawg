repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: powershell -NoProfile -Command "Set-Location engine; go vet ./..."
        language: system
        pass_filenames: false
      - id: biome
        name: biome
        entry: npx biome check --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
